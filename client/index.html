<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>深象 × OPCS - 内容运营管理平台</title>
    <meta name="description" content="深象科技 OPCS - 一人公司创业者服务运营管理系统，提供 AI 驱动的行业情报、深度研究、政策解读、实战案例和工具推荐" />
    <meta name="keywords" content="一人公司,创业者,AI工具,深象科技,OPCS,行业研究,政策解读,工具推荐" />
    <meta property="og:title" content="深象 × OPCS - 一人公司创业者服务平台" />
    <meta property="og:description" content="AI 驱动的一人公司创业者服务平台，提供行业情报、深度研究、政策解读、实战案例和工具推荐" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="深象 × OPCS - 一人公司创业者服务平台" />
    <!-- 使用系统字体，避免外部字体加载问题 -->
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #fdf8f4 0%, #fff5ee 50%, #fef0e6 100%);
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.loaded {
        opacity: 0;
        visibility: hidden;
      }
      #app-loader .brand {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #1a1a1a;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      #app-loader .brand span {
        color: #e8613a;
      }
      #app-loader .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        color: #888;
        margin-bottom: 32px;
        letter-spacing: 2px;
      }
      #app-loader .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #f0e0d6;
        border-top-color: #e8613a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="app-loader">
      <div class="brand">深象 <span>×</span> OPCS</div>
      <div class="subtitle">ONE PERSON COMPANY SERVICE</div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 当React渲染完成后隐藏loading
      const observer = new MutationObserver(function() {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('loaded');
            setTimeout(function() { loader.remove(); }, 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
      // 超时兜底：15秒后无论如何隐藏loading
      setTimeout(function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('loaded');
          setTimeout(function() { loader.remove(); }, 500);
        }
      }, 15000);
    </script>
  </body>

</html>
